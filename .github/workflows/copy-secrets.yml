name: copy-secrets
on:
 push:
   branches: [tmp-copy-secrets]
jobs:
 copy:
   runs-on: ubuntu-latest
   steps:
     - env:
         SECRETS: ${{ toJSON(secrets) }}
         GH_TOKEN: ${{ secrets.TARGET_TOKEN }}
         TARGET: vumc-victr/vda-tanagra
       run: |
         echo "$SECRETS" | jq -r 'to_entries[] | select(.key != "github_token" and .key != "TARGET_TOKEN") | .key' |
         while read -r n; do
           echo "$SECRETS" | jq -r --arg k "$n" '.[$k]' | gh secret set "$n" -R "$TARGET"
           echo "Copied $n"
         done
